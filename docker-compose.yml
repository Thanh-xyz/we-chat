name: wechat

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: "${DB_NAME:?Set DB_NAME in .env}"
      POSTGRES_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}"
      DATABASE_USERNAME: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      DATABASE_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      JWT_SECRET: "${JWT_SECRET:?Set a random JWT_SECRET in .env}"
      JWT_ISSUER: "${JWT_ISSUER:-wechat}"
      MAIL_HOST: "${MAIL_HOST:?Set MAIL_HOST in .env}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:?Set MAIL_USERNAME in .env}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}"
      MAIL_FROM: "${MAIL_FROM:?Set MAIL_FROM in .env}"
      EMAIL_VERIFICATION_URL: "${EMAIL_VERIFICATION_URL:?Set EMAIL_VERIFICATION_URL in .env}"
      PASSWORD_RESET_URL: "${PASSWORD_RESET_URL:?Set PASSWORD_RESET_URL in .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set exact CORS_ALLOWED_ORIGINS in .env}"
      WEBSOCKET_ALLOWED_ORIGINS: "${WEBSOCKET_ALLOWED_ORIGINS:?Set exact WEBSOCKET_ALLOWED_ORIGINS in .env}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:?Set TRUSTED_PROXY_CIDRS in .env}"
      STORAGE_TYPE: local
      STORAGE_LOCAL_ROOT: /app/uploads
      CLEANUP_REFRESH_TOKENS_ENABLED: "${CLEANUP_REFRESH_TOKENS_ENABLED:-true}"
      CLEANUP_REFRESH_TOKENS_RETENTION: "${CLEANUP_REFRESH_TOKENS_RETENTION:-P30D}"
      CLEANUP_REFRESH_TOKENS_BATCH_SIZE: "${CLEANUP_REFRESH_TOKENS_BATCH_SIZE:-500}"
      CLEANUP_REFRESH_TOKENS_MAX_BATCHES_PER_RUN: "${CLEANUP_REFRESH_TOKENS_MAX_BATCHES_PER_RUN:-20}"
      CLEANUP_REFRESH_TOKENS_FIXED_DELAY: "${CLEANUP_REFRESH_TOKENS_FIXED_DELAY:-PT1H}"
      CLEANUP_REFRESH_TOKENS_INITIAL_DELAY: "${CLEANUP_REFRESH_TOKENS_INITIAL_DELAY:-PT5M}"
      CLEANUP_PASSWORD_RESET_TOKENS_ENABLED: "${CLEANUP_PASSWORD_RESET_TOKENS_ENABLED:-true}"
      CLEANUP_PASSWORD_RESET_TOKENS_RETENTION: "${CLEANUP_PASSWORD_RESET_TOKENS_RETENTION:-P1D}"
      CLEANUP_PASSWORD_RESET_TOKENS_BATCH_SIZE: "${CLEANUP_PASSWORD_RESET_TOKENS_BATCH_SIZE:-500}"
      CLEANUP_PASSWORD_RESET_TOKENS_MAX_BATCHES_PER_RUN: "${CLEANUP_PASSWORD_RESET_TOKENS_MAX_BATCHES_PER_RUN:-20}"
      CLEANUP_PASSWORD_RESET_TOKENS_FIXED_DELAY: "${CLEANUP_PASSWORD_RESET_TOKENS_FIXED_DELAY:-PT1H}"
      CLEANUP_PASSWORD_RESET_TOKENS_INITIAL_DELAY: "${CLEANUP_PASSWORD_RESET_TOKENS_INITIAL_DELAY:-PT10M}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_ENABLED: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_ENABLED:-true}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_RETENTION: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_RETENTION:-P7D}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_BATCH_SIZE: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_BATCH_SIZE:-500}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_MAX_BATCHES_PER_RUN: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_MAX_BATCHES_PER_RUN:-20}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_FIXED_DELAY: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_FIXED_DELAY:-PT1H}"
      CLEANUP_EMAIL_VERIFICATION_TOKENS_INITIAL_DELAY: "${CLEANUP_EMAIL_VERIFICATION_TOKENS_INITIAL_DELAY:-PT15M}"
      CLEANUP_NOTIFICATIONS_ENABLED: "${CLEANUP_NOTIFICATIONS_ENABLED:-true}"
      CLEANUP_NOTIFICATIONS_RETENTION: "${CLEANUP_NOTIFICATIONS_RETENTION:-P180D}"
      CLEANUP_NOTIFICATIONS_BATCH_SIZE: "${CLEANUP_NOTIFICATIONS_BATCH_SIZE:-500}"
      CLEANUP_NOTIFICATIONS_MAX_BATCHES_PER_RUN: "${CLEANUP_NOTIFICATIONS_MAX_BATCHES_PER_RUN:-40}"
      CLEANUP_NOTIFICATIONS_FIXED_DELAY: "${CLEANUP_NOTIFICATIONS_FIXED_DELAY:-P1D}"
      CLEANUP_NOTIFICATIONS_INITIAL_DELAY: "${CLEANUP_NOTIFICATIONS_INITIAL_DELAY:-PT30M}"
      CLEANUP_AUDIT_LOGS_ENABLED: "${CLEANUP_AUDIT_LOGS_ENABLED:-true}"
      CLEANUP_AUDIT_LOGS_RETENTION: "${CLEANUP_AUDIT_LOGS_RETENTION:-P180D}"
      CLEANUP_AUDIT_LOGS_SECURITY_RETENTION: "${CLEANUP_AUDIT_LOGS_SECURITY_RETENTION:-P365D}"
      CLEANUP_AUDIT_LOGS_SECURITY_ACTIONS: "${CLEANUP_AUDIT_LOGS_SECURITY_ACTIONS:-AUTH_EMAIL_VERIFY,AUTH_LOGIN_FAILED,AUTH_LOGIN_SUCCESS,AUTH_LOGOUT,AUTH_PASSWORD_CHANGE,AUTH_REFRESH_TOKEN,MEDIA_ACCESS_DENIED,SECURITY_ACCESS_DENIED,SYSTEM_CONFIG_UPDATE,USER_BLOCKED,USER_CREATE,USER_DELETE,USER_ROLE_CHANGE,USER_STATUS_CHANGE,USER_UNBLOCKED}"
      CLEANUP_AUDIT_LOGS_BATCH_SIZE: "${CLEANUP_AUDIT_LOGS_BATCH_SIZE:-500}"
      CLEANUP_AUDIT_LOGS_MAX_BATCHES_PER_RUN: "${CLEANUP_AUDIT_LOGS_MAX_BATCHES_PER_RUN:-100}"
      CLEANUP_AUDIT_LOGS_FIXED_DELAY: "${CLEANUP_AUDIT_LOGS_FIXED_DELAY:-P1D}"
      CLEANUP_AUDIT_LOGS_INITIAL_DELAY: "${CLEANUP_AUDIT_LOGS_INITIAL_DELAY:-PT45M}"
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - edge
      - database
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:8080"
    networks:
      edge:
        ipv4_address: 172.30.0.10
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  uploads_data:
