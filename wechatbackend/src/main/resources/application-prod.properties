server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
# Comma-separated CIDR blocks for controlled reverse proxies. Empty means trust no proxy.
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_CIDRS:}
server.tomcat.remoteip.trusted-proxies=

# Empty by default is fail-safe: production must explicitly provide exact frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

logging.level.main.com.chat.wechat=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
