spring.application.name=wechat
spring.config.import=optional:file:.env[.properties],optional:file:wechatbackend/.env[.properties]
server.forward-headers-strategy=none

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:wechat}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}

app.rbac.default-user-role=${DEFAULT_USER_ROLE:USER}
app.rbac.super-admin-role=${SUPER_ADMIN_ROLE:SUPER_ADMIN}

app.rate-limit.auth-login.capacity=${RATE_LIMIT_AUTH_LOGIN_CAPACITY:5}
app.rate-limit.auth-login.refill-minutes=${RATE_LIMIT_AUTH_LOGIN_REFILL_MINUTES:1}
app.rate-limit.auth-refresh.capacity=${RATE_LIMIT_AUTH_REFRESH_CAPACITY:20}
app.rate-limit.auth-refresh.refill-minutes=${RATE_LIMIT_AUTH_REFRESH_REFILL_MINUTES:1}
app.rate-limit.auth-register.capacity=${RATE_LIMIT_AUTH_REGISTER_CAPACITY:5}
app.rate-limit.auth-register.refill-minutes=${RATE_LIMIT_AUTH_REGISTER_REFILL_MINUTES:1}
app.rate-limit.auth-resend-verification.capacity=${RATE_LIMIT_AUTH_RESEND_VERIFICATION_CAPACITY:3}
app.rate-limit.auth-resend-verification.refill-minutes=${RATE_LIMIT_AUTH_RESEND_VERIFICATION_REFILL_MINUTES:15}
app.rate-limit.message-send.capacity=${RATE_LIMIT_MESSAGE_SEND_CAPACITY:60}
app.rate-limit.message-send.refill-minutes=${RATE_LIMIT_MESSAGE_SEND_REFILL_MINUTES:1}
app.rate-limit.websocket-connect.capacity=${RATE_LIMIT_WEBSOCKET_CONNECT_CAPACITY:20}
app.rate-limit.websocket-connect.refill-minutes=${RATE_LIMIT_WEBSOCKET_CONNECT_REFILL_MINUTES:1}

app.security.max-failed-login-attempts=${MAX_FAILED_LOGIN_ATTEMPTS:3}
app.security.lock-duration=${LOCK_DURATION:PT15M}
app.security.require-email-verified=${AUTH_REQUIRE_EMAIL_VERIFIED:false}
app.security.email-verification-token-ttl=${EMAIL_VERIFICATION_TOKEN_TTL:PT24H}
app.security.password-reset-token-ttl=${PASSWORD_RESET_TOKEN_TTL:PT15M}
app.security.verification-email-cooldown=${VERIFICATION_EMAIL_COOLDOWN:PT5M}

# R14 data lifecycle. Durations use ISO-8601 syntax; retention is separate from token TTL.
app.cleanup.refresh-tokens.enabled=${CLEANUP_REFRESH_TOKENS_ENABLED:true}
app.cleanup.refresh-tokens.retention=${CLEANUP_REFRESH_TOKENS_RETENTION:P30D}
app.cleanup.refresh-tokens.batch-size=${CLEANUP_REFRESH_TOKENS_BATCH_SIZE:500}
app.cleanup.refresh-tokens.max-batches-per-run=${CLEANUP_REFRESH_TOKENS_MAX_BATCHES_PER_RUN:20}
app.cleanup.refresh-tokens.fixed-delay=${CLEANUP_REFRESH_TOKENS_FIXED_DELAY:PT1H}
app.cleanup.refresh-tokens.initial-delay=${CLEANUP_REFRESH_TOKENS_INITIAL_DELAY:PT5M}

app.cleanup.password-reset-tokens.enabled=${CLEANUP_PASSWORD_RESET_TOKENS_ENABLED:true}
app.cleanup.password-reset-tokens.retention=${CLEANUP_PASSWORD_RESET_TOKENS_RETENTION:P1D}
app.cleanup.password-reset-tokens.batch-size=${CLEANUP_PASSWORD_RESET_TOKENS_BATCH_SIZE:500}
app.cleanup.password-reset-tokens.max-batches-per-run=${CLEANUP_PASSWORD_RESET_TOKENS_MAX_BATCHES_PER_RUN:20}
app.cleanup.password-reset-tokens.fixed-delay=${CLEANUP_PASSWORD_RESET_TOKENS_FIXED_DELAY:PT1H}
app.cleanup.password-reset-tokens.initial-delay=${CLEANUP_PASSWORD_RESET_TOKENS_INITIAL_DELAY:PT10M}

app.cleanup.email-verification-tokens.enabled=${CLEANUP_EMAIL_VERIFICATION_TOKENS_ENABLED:true}
app.cleanup.email-verification-tokens.retention=${CLEANUP_EMAIL_VERIFICATION_TOKENS_RETENTION:P7D}
app.cleanup.email-verification-tokens.batch-size=${CLEANUP_EMAIL_VERIFICATION_TOKENS_BATCH_SIZE:500}
app.cleanup.email-verification-tokens.max-batches-per-run=${CLEANUP_EMAIL_VERIFICATION_TOKENS_MAX_BATCHES_PER_RUN:20}
app.cleanup.email-verification-tokens.fixed-delay=${CLEANUP_EMAIL_VERIFICATION_TOKENS_FIXED_DELAY:PT1H}
app.cleanup.email-verification-tokens.initial-delay=${CLEANUP_EMAIL_VERIFICATION_TOKENS_INITIAL_DELAY:PT15M}

app.cleanup.notifications.enabled=${CLEANUP_NOTIFICATIONS_ENABLED:true}
app.cleanup.notifications.retention=${CLEANUP_NOTIFICATIONS_RETENTION:P180D}
app.cleanup.notifications.batch-size=${CLEANUP_NOTIFICATIONS_BATCH_SIZE:500}
app.cleanup.notifications.max-batches-per-run=${CLEANUP_NOTIFICATIONS_MAX_BATCHES_PER_RUN:40}
app.cleanup.notifications.fixed-delay=${CLEANUP_NOTIFICATIONS_FIXED_DELAY:P1D}
app.cleanup.notifications.initial-delay=${CLEANUP_NOTIFICATIONS_INITIAL_DELAY:PT30M}

app.cleanup.audit-logs.enabled=${CLEANUP_AUDIT_LOGS_ENABLED:true}
app.cleanup.audit-logs.retention=${CLEANUP_AUDIT_LOGS_RETENTION:P180D}
app.cleanup.audit-logs.security-retention=${CLEANUP_AUDIT_LOGS_SECURITY_RETENTION:P365D}
app.cleanup.audit-logs.security-actions=${CLEANUP_AUDIT_LOGS_SECURITY_ACTIONS:AUTH_EMAIL_VERIFY,AUTH_LOGIN_FAILED,AUTH_LOGIN_SUCCESS,AUTH_LOGOUT,AUTH_PASSWORD_CHANGE,AUTH_REFRESH_TOKEN,MEDIA_ACCESS_DENIED,SECURITY_ACCESS_DENIED,SYSTEM_CONFIG_UPDATE,USER_BLOCKED,USER_CREATE,USER_DELETE,USER_ROLE_CHANGE,USER_STATUS_CHANGE,USER_UNBLOCKED}
app.cleanup.audit-logs.batch-size=${CLEANUP_AUDIT_LOGS_BATCH_SIZE:500}
app.cleanup.audit-logs.max-batches-per-run=${CLEANUP_AUDIT_LOGS_MAX_BATCHES_PER_RUN:100}
app.cleanup.audit-logs.fixed-delay=${CLEANUP_AUDIT_LOGS_FIXED_DELAY:P1D}
app.cleanup.audit-logs.initial-delay=${CLEANUP_AUDIT_LOGS_INITIAL_DELAY:PT45M}

app.auth.email-verification-url=${EMAIL_VERIFICATION_URL:}
app.auth.password-reset-url=${PASSWORD_RESET_URL:}
app.auth.mail.host=${MAIL_HOST:}
app.auth.mail.port=${MAIL_PORT:587}
app.auth.mail.username=${MAIL_USERNAME:}
app.auth.mail.password=${MAIL_PASSWORD:}
app.auth.mail.from=${MAIL_FROM:}

app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# R15 process-local notification fanout. A durable outbox/queue is future work.
app.notification.executor.core-size=${NOTIFICATION_EXECUTOR_CORE_SIZE:2}
app.notification.executor.max-size=${NOTIFICATION_EXECUTOR_MAX_SIZE:8}
app.notification.executor.queue-capacity=${NOTIFICATION_EXECUTOR_QUEUE_CAPACITY:1000}
app.notification.executor.batch-size=${NOTIFICATION_EXECUTOR_BATCH_SIZE:100}
app.notification.executor.shutdown-timeout=${NOTIFICATION_EXECUTOR_SHUTDOWN_TIMEOUT:PT10S}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Request-ID}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-ID}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

app.storage.type=${STORAGE_TYPE:local}
app.storage.local-root=${STORAGE_LOCAL_ROOT:uploads}

app.attachment.image-max-size=${ATTACHMENT_IMAGE_MAX_SIZE:10MB}
app.attachment.file-max-size=${ATTACHMENT_FILE_MAX_SIZE:50MB}
app.attachment.voice-max-size=${ATTACHMENT_VOICE_MAX_SIZE:25MB}
app.attachment.allowed-image-types=${ATTACHMENT_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/webp,image/gif}
app.attachment.allowed-file-types=${ATTACHMENT_ALLOWED_FILE_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,text/plain,application/zip,application/x-zip-compressed}
app.attachment.allowed-voice-types=${ATTACHMENT_ALLOWED_VOICE_TYPES:audio/mpeg,audio/wav,audio/x-wav,audio/mp4,audio/webm,audio/x-m4a}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:60MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:60MB}

logging.level.main.com.chat.wechat=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
